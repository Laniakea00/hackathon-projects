services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────────────────
  db:
    image: ankane/pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-qazcode}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-qazcode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Bootstrap (optional: only if data/.embeddings/ cache is missing) ────────
  # Normal start: docker compose up -d          (skips bootstrap)
  # Force ingest:  docker compose --profile ingest up bootstrap
  bootstrap:
    profiles: ["ingest"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-qazcode}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://hub.qazcode.ai/v1}
      LLM_API_KEY:  ${LLM_API_KEY:-}
      LLM_MODEL:    ${LLM_MODEL:-oss-120b}
    volumes:
      - ./data:/app/data
    command: ["uv", "run", "python", "scripts/bootstrap.py"]
    restart: "no"

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-qazcode}
      ASYNC_DATABASE_URL: >-
        postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-qazcode}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://hub.qazcode.ai/v1}
      LLM_API_KEY:  ${LLM_API_KEY:-}
      LLM_MODEL:    ${LLM_MODEL:-oss-120b}
      JWT_SECRET:   ${JWT_SECRET:-change-me-in-production}
      # Offline mode: don't check HuggingFace for updates
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./llm:/app/llm
      # Mount host HF cache so the model is never re-downloaded
      - ${HF_CACHE:-C:/Users/230701/.cache/huggingface}:/root/.cache/huggingface

volumes:
  pgdata:
